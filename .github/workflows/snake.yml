name: Snake

# The one widget worth keeping from someone else: it animates rather than
# summarises, so it does something the generated panels do not. Palette is
# passed in explicitly so it renders in phosphor rather than GitHub green.
#
# Output lands on the `output` branch, which keeps ~700 KB of regenerated
# animation out of main's history.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=%23FFA94D&color_dots=%23141418,%232A1D0E,%235C3A12,%23C2701F,%23FFA94D
            dist/snake-light.svg?color_snake=%23B45309&color_dots=%23F1EBDF,%23F0D9A8,%23E1A85C,%23C2701F,%23B45309

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "snake: refresh [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
