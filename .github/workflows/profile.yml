name: Rebuild profile

# The profile rebuilds itself. Nobody opens README.md to update a number.
#
#   · daily          keeps streaks, stars and the skyline honest
#   · on config push copy and product changes go live immediately
#   · manually       for when you want it now
on:
  schedule:
    - cron: "17 3 * * *"        # 03:17 UTC, off the hour, out of the stampede
  push:
    branches: [main]
    paths:
      - "profile.config.json"
      - "README.template.md"
      - "generator/**"
      - ".github/workflows/profile.yml"
  workflow_dispatch:
    inputs:
      redither:
        description: "Re-dither the portrait from the current avatar"
        type: boolean
        default: false

concurrency:
  group: profile
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pillow is needed only to re-dither the portrait. Everything else in
      # the generator is standard library, so the common path installs nothing.
      - name: Install Pillow
        if: inputs.redither
        run: pip install -r requirements.txt

      - name: Fetch data, probe production, render panels
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python -m generator.build --fetch ${{ inputs.redither && '--photo' || '' }}

      - name: Enforce budgets, palette and accessibility
        run: python generator/check.py

      - name: Commit only if something actually changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md generator/data.json
          if git diff --cached --quiet; then
            echo "nothing changed, no commit"
            exit 0
          fi
          git commit -m "profile: refresh generated assets [skip ci]"
          git push
